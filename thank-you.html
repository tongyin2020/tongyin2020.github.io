<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Sent | InsightBridge Global</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400;500;700&display=swap" rel="stylesheet">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: var(--color-bg); }
  .thankyou-box {
    text-align: center;
    max-width: 520px;
    padding: 60px 40px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    margin: 20px;
  }
  .thankyou-icon {
    width: 72px; height: 72px;
    background: #d1fae5;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 28px;
  }
  .thankyou-icon svg { width: 36px; height: 36px; color: #059669; }
  h1 { font-size: 2rem; margin: 0 0 12px; color: var(--color-text); }
  p { color: var(--color-text-muted); line-height: 1.7; margin: 0 0 32px; font-size: 1rem; }
  .btn-home {
    display: inline-block;
    padding: 12px 32px;
    background: var(--color-primary);
    color: #fff;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: opacity 0.2s;
  }
  .btn-home:hover { opacity: 0.85; }
  .email-note { font-size: 0.82rem; color: var(--color-text-muted); margin-top: 20px; }
</style>
</head>
<body>
<div class="thankyou-box">
  <div class="thankyou-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <h1>Message Sent!</h1>
  <p>Thank you for reaching out to InsightBridge Global.<br>
  Dr. Tong Yin will review your message and respond personally, typically within 1–2 business days.</p>
  <a href="/" class="btn-home">← Back to InsightBridge Global</a>
  <p class="email-note">You can also reach us directly at <a href="mailto:tongyin@insightbridge.global">tongyin@insightbridge.global</a></p>
</div>

</body>
</html>
